# Compiles the Android module on every pull request. The module has no Gradle project of its own —
# it builds through a host app — so the example app in this repository is the host: its native
# project is generated with prebuild, then the module's Kotlin is compiled and the manifest merged.
name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile the module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # The config plugin is loaded from the repository root, so it resolves expo/config-plugins
      # here rather than from the example app.
      - name: Install the module's dependencies
        run: npm ci

      - name: Install the example app's dependencies
        working-directory: example
        run: npm ci

      # The native project is not committed. Prebuild generates it and runs the config plugin,
      # which is what writes the service, the boot receiver and the permissions into the manifest.
      - name: Generate the Android project
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      # Compiling alone would not look at the manifest, so the merge runs too: that is what fails
      # if the plugin emits something the platform rejects.
      - name: Compile and merge the manifest
        working-directory: example/android
        run: ./gradlew :expo-blocker:compileReleaseKotlin :app:processReleaseManifest
